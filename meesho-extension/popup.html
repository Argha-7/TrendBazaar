<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TrendBazaar Meesho Exporter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }
    .title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-chip {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid #10b981;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    
    .card-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .card-img-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-img {
      width: 75px;
      height: 75px;
      border-radius: 8px;
      object-fit: cover;
      border: 2px solid #2563eb;
      background: #0f172a;
    }
    .card-title-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Multi-Image Gallery Strip */
    .gallery-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .gallery-thumb {
      width: 52px;
      height: 52px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .gallery-thumb.active {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .price-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .price-label { font-size: 0.72rem; color: #94a3b8; font-weight: 600; margin-bottom: 2px; }
    .price-val { font-size: 1rem; font-weight: 800; color: #fbbf24; }
    .price-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #2563eb;
      color: #34d399;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .btn-publish {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s ease;
    }
    .btn-publish:hover {
      background: #1d4ed8;
    }

    .btn-admin {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .btn-admin:hover {
      color: #fff;
    }

    .toast-msg {
      font-size: 0.8rem;
      color: #34d399;
      text-align: center;
      margin-top: 8px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">⚡ TrendBazaar Exporter</div>
    <span class="status-chip" id="statusChip">Connected</span>
  </div>

  <!-- VISUAL EXTRACTED CARD -->
  <div class="card-box" id="productCardBox">
    <div class="card-img-row">
      <img id="popImg" src="https://images.meesho.com/images/products/919864713/ysbzv_512.jpg" class="card-img" alt="Extracted Photo">
      <div style="flex-grow: 1;">
        <div style="font-size: 0.7rem; color: #38bdf8; font-weight: 800; text-transform: uppercase;">Extracted Product:</div>
        <div id="popTitle" class="card-title-text">Product Title</div>
      </div>
    </div>

    <!-- Multi-Image Gallery Strip -->
    <div style="font-size: 0.72rem; color: #94a3b8; font-weight: 700; margin-bottom: 6px;">📷 EXTRACTED HD PHOTOS:</div>
    <div id="popGalleryStrip" class="gallery-strip">
      <!-- Injected by popup.js -->
    </div>

    <div class="price-grid">
      <div>
        <div class="price-label">Meesho Wholesale Cost:</div>
        <div class="price-val" id="popCost">₹360</div>
      </div>
      <div>
        <div class="price-label">Selling Price:</div>
        <input type="number" id="popSellingInput" class="price-input" value="799">
      </div>
    </div>

    <button id="btnPublishDirect" class="btn-publish">🚀 Export to Admin Product Editor</button>
    <button id="btnOpenAdmin" class="btn-admin">👑 Open Master Admin Panel</button>
  </div>

  <div id="toastMsg" class="toast-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
