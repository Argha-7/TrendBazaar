<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wallet | TrendBazaar</title>
  
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="wallet.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="sk-header" id="skHeader" style="position: sticky; top: 0; z-index: 1000;">
    <div class="sk-header-container">
      <div class="sk-header-left">
        <a href="index.html" class="sk-logo">TrendBazaar</a>
      </div>
      <div class="sk-header-right">
        <a href="profile.html" class="sk-nav-icon"><i class="ri-user-line"></i></a>
      </div>
    </div>
  </header>

  <div class="wallet-container">
    <!-- Header Card -->
    <div class="wallet-header-card">
      <div class="wallet-title">TrendBazaar Wallet Balance</div>
      <div class="wallet-balance"><span>₹</span><span id="walletBalanceAmt">0</span></div>
      
      <div class="wallet-actions">
        <button class="w-btn w-btn-primary" onclick="window.location.href='index.html'">
          <i class="ri-shopping-bag-3-fill"></i> Shop Now
        </button>
        <button class="w-btn w-btn-secondary" onclick="refreshWallet()">
          <i class="ri-refresh-line"></i> Refresh
        </button>
      </div>
    </div>

    <!-- Transactions -->
    <div class="tx-section">
      <div class="tx-header">
        <span>Recent Transactions</span>
        <i class="ri-history-line" style="color: var(--w-primary);"></i>
      </div>
      <div class="tx-list" id="txList">
        <!-- Loader -->
        <div class="empty-state">
          <i class="ri-loader-4-line" style="animation: spin 1s linear infinite;"></i>
          <p>Loading transactions...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>
  <script src="wallet.js"></script>
</body>
</html>
