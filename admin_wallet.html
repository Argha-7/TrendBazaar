<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet Manager | TrendBazaar Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="style_master.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #f1f5f9; font-family: 'Inter', sans-serif; margin: 0; }

    .adm-wallet-page { display: flex; min-height: 100vh; }

    /* ---- Sidebar ---- */
    .adm-sidebar { width: 240px; background: #1e293b; padding: 24px 0; flex-shrink: 0; }
    .adm-sidebar-logo { color: #fff; font-size: 1.3rem; font-weight: 900; padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .adm-sidebar-link { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: rgba(255,255,255,0.6); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .adm-sidebar-link:hover, .adm-sidebar-link.active { color: #fff; background: rgba(255,255,255,0.1); }
    .adm-sidebar-link i { font-size: 1.1rem; }

    /* ---- Main Content ---- */
    .adm-wallet-main { flex: 1; padding: 32px; overflow-y: auto; }
    .adm-wallet-header { margin-bottom: 28px; }
    .adm-wallet-header h1 { font-size: 1.8rem; font-weight: 900; color: #1e293b; margin: 0 0 6px; }
    .adm-wallet-header p { color: #64748b; margin: 0; }

    /* ---- Stats Row ---- */
    .adm-stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 28px; }
    .adm-stat-card { background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .adm-stat-card .stat-label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; }
    .adm-stat-card .stat-value { font-size: 2rem; font-weight: 900; color: #1e293b; }
    .adm-stat-card .stat-icon { font-size: 2rem; margin-bottom: 12px; }

    /* ---- Users Table ---- */
    .adm-card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 24px; }
    .adm-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .adm-card-header h2 { font-size: 1.15rem; font-weight: 800; color: #1e293b; margin: 0; }
    .adm-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .adm-table th { text-align: left; padding: 12px 14px; background: #f8fafc; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; border-bottom: 1px solid #e2e8f0; }
    .adm-table td { padding: 14px; border-bottom: 1px solid #f1f5f9; color: #334155; vertical-align: middle; }
    .adm-table tr:hover td { background: #f8fafc; }
    .adm-table td:last-child { white-space: nowrap; }

    /* ---- Credit/Debit Modal ---- */
    .adm-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .adm-modal-overlay.active { display: flex; }
    .adm-modal-box { background: #fff; border-radius: 20px; padding: 32px; width: 420px; max-width: 90vw; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
    .adm-modal-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; color: #1e293b; }
    .adm-form-group { margin-bottom: 16px; }
    .adm-form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: #64748b; margin-bottom: 6px; }
    .adm-form-group input, .adm-form-group select, .adm-form-group textarea {
      width: 100%; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 10px;
      font-size: 0.9rem; color: #1e293b; box-sizing: border-box; font-family: inherit;
    }
    .adm-btn-row { display: flex; gap: 12px; margin-top: 20px; }
    .adm-btn { padding: 12px 20px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .adm-btn-primary { background: #2563eb; color: #fff; flex: 1; }
    .adm-btn-danger { background: #dc2626; color: #fff; flex: 1; }
    .adm-btn-cancel { background: #f1f5f9; color: #64748b; }
    .adm-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .badge-credit { background: #d1fae5; color: #059669; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-debit  { background: #fee2e2; color: #dc2626; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-uid { background: #f1f5f9; color: #475569; padding: 3px 10px; border-radius: 6px; font-size: 0.72rem; font-family: monospace; }
    
    .adm-sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1999; display: none; opacity: 0; transition: opacity 0.3s; }
    .adm-sidebar-overlay.active { display: block; opacity: 1; }
    .adm-icon-btn { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 5px; color: #1e293b; }

    @media (max-width: 900px) {
      .adm-sidebar { position: fixed; height: 100vh; transform: translateX(-100%); transition: transform 0.3s; z-index: 2000; }
      .adm-sidebar.open { transform: translateX(0); }
      .adm-wallet-main { padding: 16px; }
      .adm-stats-row { grid-template-columns: 1fr; }
      .adm-icon-btn { display: inline-block; }
      .adm-wallet-header { display: flex; align-items: center; gap: 12px; }
      .adm-wallet-header h1 { font-size: 1.4rem; }
      .adm-table-wrap { overflow-x: auto; }
    }
</head>
<body>

<div class="adm-wallet-page">
  <div class="adm-sidebar-overlay" id="admSidebarOverlay"></div>
  <!-- Sidebar -->
  <aside class="adm-sidebar">
    <div class="adm-sidebar-logo"><i class="ri-shopping-cart-fill"></i> TrendBazaar</div>
    <a href="admin_master.html" class="adm-sidebar-link"><i class="ri-dashboard-line"></i> Dashboard</a>
    <a href="admin_add_product.html" class="adm-sidebar-link"><i class="ri-add-box-line"></i> Add Products</a>
    <a href="admin_wallet.html" class="adm-sidebar-link active"><i class="ri-wallet-3-fill"></i> Wallet Manager</a>
    <a href="index.html" class="adm-sidebar-link" style="margin-top: auto;"><i class="ri-store-2-line"></i> View Store</a>
  </aside>

  <!-- Main -->
  <main class="adm-wallet-main">
    <div id="adminAuthGuard" style="display:none; text-align:center; padding: 80px 20px;">
      <i class="ri-lock-2-fill" style="font-size: 3rem; color: #dc2626;"></i>
      <h2>Access Denied</h2>
      <p>This page is for the Master Admin only.</p>
    </div>

    <div id="adminWalletContent">
      <div class="adm-wallet-header">
        <button class="adm-icon-btn" id="admSidebarToggle"><i class="ri-menu-line"></i></button>
        <div>
          <h1>💳 Wallet Manager</h1>
          <p>View all user wallets, credit/debit balances, and track transaction history.</p>
        </div>
      </div>

      <!-- Stats -->
      <div class="adm-stats-row">
        <div class="adm-stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-label">Total Wallet Users</div>
          <div class="stat-value" id="statTotalUsers">—</div>
        </div>
        <div class="adm-stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-label">Total Balance in Wallets</div>
          <div class="stat-value" id="statTotalBalance">—</div>
        </div>
        <div class="adm-stat-card">
          <div class="stat-icon">📋</div>
          <div class="stat-label">Total Transactions</div>
          <div class="stat-value" id="statTotalTx">—</div>
        </div>
      </div>

      <!-- Wallets Table -->
      <div class="adm-card">
        <div class="adm-card-header">
          <h2>👥 User Wallets</h2>
        </div>
        <div class="adm-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th>User UID</th>
                <th>Current Balance</th>
                <th>Last Updated</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="walletsTableBody">
              <tr><td colspan="4" style="text-align:center;padding:30px;color:#94a3b8;">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Recent Transactions Table -->
      <div class="adm-card">
        <div class="adm-card-header">
          <h2>📋 Transaction History</h2>
        </div>
        <div class="adm-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th>Date & Time</th>
                <th>UID</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Reference / Remarks</th>
              </tr>
            </thead>
            <tbody id="txTableBody">
              <tr><td colspan="5" style="text-align:center;padding:30px;color:#94a3b8;">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Credit/Debit Modal -->
<div class="adm-modal-overlay" id="walletModal">
  <div class="adm-modal-box">
    <div class="adm-modal-title">💳 Adjust User Wallet</div>
    <div style="background: #f8fafc; border-radius: 10px; padding: 10px 14px; font-size: 0.82rem; margin-bottom: 16px;">
      User: <span id="modalUserUid" style="font-family:monospace; font-weight:700;"></span>
    </div>
    <div class="adm-form-group">
      <label>Operation Type</label>
      <select id="modalOpType">
        <option value="CREDIT">💚 CREDIT (Add Money)</option>
        <option value="DEBIT">❤️ DEBIT (Deduct Money)</option>
      </select>
    </div>
    <div class="adm-form-group">
      <label>Amount (₹)</label>
      <input type="number" id="modalAmount" placeholder="Enter amount e.g. 50" min="1">
    </div>
    <div class="adm-form-group">
      <label>Description / Reason</label>
      <textarea id="modalDescription" rows="2" placeholder="e.g. Referral Bonus, Order Refund..."></textarea>
    </div>
    <div class="adm-btn-row">
      <button class="adm-btn adm-btn-primary" onclick="submitWalletAdjustment()">
        <i class="ri-check-line"></i> Confirm
      </button>
      <button class="adm-btn adm-btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
    <div id="modalStatus" style="margin-top: 12px; font-size: 0.85rem; font-weight: 700; text-align: center;"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="admin_wallet.js"></script>
</body>
</html>
